<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="To-Do">
<meta name="theme-color" content="#141311">
<title>Desk To-Do</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
  /* Runs on iOS 12 Safari: no flex `gap`, so spacing is done with margins. */
  :root { --bg: #141311; --ink: #F3EFE8; --muted: #A39C90; --faint: #8C857A; --line: #2A2824; --todo: #F0A070; --waiting: #8FB0F5; --ok: #6FBF84; --bad: #E0735A; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  .board {
    height: 100%; display: flex; flex-direction: column;
    padding: 40px 48px; padding-left: calc(48px + env(safe-area-inset-left)); padding-right: calc(48px + env(safe-area-inset-right));
  }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; }
  .date { font-family: "Fraunces", Georgia, serif; font-size: 34px; font-weight: 500; letter-spacing: -0.01em; }
  .right { text-align: right; }
  .time { font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .fresh { margin-top: 4px; font-size: 13px; color: var(--muted); }
  .fresh .dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--ok); vertical-align: 1px; }
  .stale .fresh { color: var(--bad); }
  .stale .fresh .dot { background: var(--bad); }
  .stale .date, .stale .time { color: var(--muted); }

  .columns { flex: 1; display: flex; min-height: 0; }
  .column { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .column + .column { margin-left: 48px; }
  h2 { margin: 0 0 8px; padding-bottom: 12px; border-bottom: 2px solid var(--col); font-size: 15px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--col); }

  .task {
    display: block; width: 100%; padding: 18px 4px; margin: 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .task .inner { display: flex; align-items: center; }
  .circle {
    flex-shrink: 0; width: 40px; height: 40px; margin-right: 20px; border-radius: 50%; border: 3px solid var(--col);
    display: flex; align-items: center; justify-content: center;
  }
  .circle svg { display: none; }
  .label { flex: 1; min-width: 0; font-size: 26px; line-height: 1.25; word-wrap: break-word; }
  .undo { display: none; flex-shrink: 0; margin-left: 16px; font-size: 15px; color: var(--muted); }
  .task.done { opacity: 0.55; }
  .task.done .circle { background: var(--col); }
  .task.done .circle svg { display: block; }
  .task.done .label { text-decoration: line-through; color: var(--muted); }
  .task.done .undo { display: block; }

  /* More than six in a column: tighten so ten still fit without scrolling. */
  .compact .task { padding: 11px 4px; }
  .compact .circle { width: 32px; height: 32px; margin-right: 16px; }
  .compact .label { font-size: 21px; }

  .empty { padding: 24px 4px; font-size: 22px; color: var(--faint); }

  @media (max-width: 820px) {
    .board { padding: 28px 24px; }
    .date, .time { font-size: 26px; }
    .column + .column { margin-left: 24px; }
    .label { font-size: 21px; }
    .circle { width: 34px; height: 34px; margin-right: 14px; }
  }

  .gate { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); -webkit-user-select: text; user-select: text; }
  .gate form { width: 100%; max-width: 440px; }
  .gate h2 { border: 0; padding: 0; margin: 0 0 12px; font-family: "Fraunces", Georgia, serif; font-size: 30px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .gate p { margin: 0 0 20px; color: var(--muted); font-size: 17px; }
  .gate label { display: block; margin-bottom: 8px; font-size: 15px; font-weight: 600; }
  .gate input { display: block; width: 100%; height: 52px; margin-bottom: 16px; padding: 0 14px; border: 1px solid #3A3731; border-radius: 10px; background: #1E1C19; color: var(--ink); font: inherit; font-size: 18px; -webkit-appearance: none; }
  .gate button { height: 52px; padding: 0 28px; border: 0; border-radius: 10px; background: var(--todo); color: var(--bg); font: inherit; font-size: 17px; font-weight: 600; -webkit-appearance: none; }
</style>
</head>
<body>
<div class="board" id="board">
  <header>
    <div class="date" id="date"></div>
    <div class="right">
      <div class="time" id="time"></div>
      <div class="fresh"><span class="dot"></span><span id="fresh">Connecting…</span></div>
    </div>
  </header>
  <div class="columns">
    <section class="column" id="col-todo" style="--col: var(--todo)">
      <h2>To Do · <span id="count-todo">0</span></h2>
      <div id="list-todo"></div>
    </section>
    <section class="column" id="col-waiting" style="--col: var(--waiting)">
      <h2>Awaiting Response · <span id="count-waiting">0</span></h2>
      <div id="list-waiting"></div>
    </section>
  </div>
</div>

<div id="key-gate" class="gate" hidden>
  <form id="key-form">
    <h2>Enter your access key</h2>
    <p id="key-message"></p>
    <label for="key-input">Access key</label>
    <input id="key-input" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="submit">Save</button>
  </form>
</div>

<script src="common.js"></script>
<script src="board.js"></script>
</body>
</html>
